[project]
name = "mirror-server"
version = "0.1.0"
description = "MY-ror smart mirror backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "boto3>=1.34",
    "httpx>=0.27",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    "anthropic>=1,<2",
    "fal-client>=0.5",
    "numpy>=1.26",
    "pgvector>=0.3",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
ml = [
    "open_clip_torch>=2.26",
    "torch>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# ASYNC109: timeout params are deliberate; ASYNC110: the daily loop re-reads the wall clock.
ignore = ["ASYNC109", "ASYNC110"]
